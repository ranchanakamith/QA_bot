[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qabot"
version = "0.1.0"
description = "Automated website QA audit with a weighted 0-100 score"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "lxml>=4.9",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "playwright>=1.40",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
qabot = "qabot.cli:main"

[tool.setuptools]
packages = ["qabot", "qabot.checks"]

[tool.setuptools.package-data]
qabot = ["default.yaml", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
